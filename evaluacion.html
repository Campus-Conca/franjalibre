<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
[hidden] { display:none !important; }
:root {
  --vp:#1A3A2A; --vs:#2D5A3D; --vv:#4A8C5C; --vc:#7AB88A;
  --oc:#E8A85A; --cr:#F5EED8; --cs:#F7F4E4;
  --na:#EE7D1D; --na-l:#FFEBD6; --na-t:#A9500F;
  --rojo:#B23A26; --rojo-l:#F9E1DA; --verde-l:#E3F1E6;
  --papel:#FFFDF7; --gris:#5E6D63;
}
html { -webkit-text-size-adjust:100%; }
body {
  font-family:'Instrument Sans', system-ui, sans-serif; background:var(--cs); color:var(--vp);
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
a { color:inherit; }
input, textarea { font:inherit; color:inherit; }

/* Puntitos de semitono, como en los carteles */
.fondo-puntos {
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(circle, rgba(238,125,29,.30) 1.3px, transparent 1.7px);
  background-size:11px 11px;
  -webkit-mask-image:radial-gradient(ellipse 70% 38% at 100% 0%, #000 0%, transparent 72%), radial-gradient(ellipse 60% 34% at 0% 100%, #000 0%, transparent 72%);
          mask-image:radial-gradient(ellipse 70% 38% at 100% 0%, #000 0%, transparent 72%), radial-gradient(ellipse 60% 34% at 0% 100%, #000 0%, transparent 72%);
}
#app { position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding:0 16px; }

/* ---------- BARRA: regresar + papel picado de avance ---------- */
.barra {
  position:sticky; top:0; z-index:6; padding:10px 0 8px;
  background:linear-gradient(var(--cs) 78%, rgba(247,244,228,0));
  display:grid; grid-template-columns:40px 1fr; column-gap:10px; align-items:center;
}
.atras {
  width:38px; height:38px; border-radius:50%; border:2px solid var(--vp); background:var(--papel);
  font-size:19px; font-weight:700; line-height:1; display:grid; place-items:center;
}
.picado { position:relative; display:flex; gap:5px; padding-top:3px; }
.picado .hilo { position:absolute; left:-3px; right:-3px; top:3px; height:2.5px; border-radius:3px; background:rgba(26,58,42,.25); overflow:hidden; }
.picado .hilo i { position:absolute; inset:0 auto 0 0; width:0; background:var(--vp); transition:width .45s ease; }
.bandera { flex:1; height:28px; transform-origin:50% 0; }
.bandera svg { display:block; width:100%; height:100%; }
.bandera.actual { animation:mecer 2.6s ease-in-out infinite; }
@keyframes mecer { 0%,100% { transform:rotate(-2.5deg); } 50% { transform:rotate(2.5deg); } }
.seccion { grid-column:2; display:flex; justify-content:space-between; gap:8px; margin-top:4px; font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--vs); }
.seccion span:last-child { color:var(--gris); letter-spacing:.04em; text-transform:none; font-weight:600; }

/* ---------- PANTALLA ---------- */
.pantalla { flex:1; padding:6px 0 130px; outline:none; }
.pantalla.entra { animation:entra .34s cubic-bezier(.2,.8,.2,1) both; }
.pantalla.entra.izq { animation-name:entraIzq; }
@keyframes entra { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:none; } }
@keyframes entraIzq { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:none; } }

/* Conejo guía con su globo */
.guia { display:flex; align-items:flex-end; gap:8px; margin:4px 0 12px; min-height:70px; }
.guia-cara { width:60px; height:72px; flex-shrink:0; }
.guia-cara svg { width:100%; height:100%; overflow:visible; }
.guia-cara.salta { animation:salta .45s ease; }
@keyframes salta { 0%,100% { transform:none; } 40% { transform:translateY(-7px) rotate(-4deg); } }
.globo {
  position:relative; background:var(--papel); border:2px solid var(--vp); border-radius:16px;
  padding:9px 13px; font-size:14px; line-height:1.42; font-weight:500; box-shadow:3px 3px 0 var(--vp);
  margin-bottom:12px;
}
.globo::before {
  content:''; position:absolute; left:-9px; bottom:10px; width:12px; height:12px; background:var(--papel);
  border-left:2px solid var(--vp); border-bottom:2px solid var(--vp); transform:rotate(45deg);
}

.preg {
  font-family:'Fraunces', serif; font-weight:900; font-size:clamp(25px, 7.2vw, 32px);
  line-height:1.08; letter-spacing:-.01em; margin:2px 0 8px; text-wrap:balance;
}
.preg em { font-style:normal; color:var(--na-t); }
.sub { font-size:14.5px; color:var(--gris); margin:-2px 0 16px; line-height:1.45; }

/* Ficha chica de la actividad en turno */
.ficha-act {
  display:flex; align-items:center; gap:12px; background:var(--na-l); border:2px solid var(--na-t);
  border-radius:14px; padding:10px 14px; margin:0 0 14px;
}
.ficha-act .e { font-size:30px; line-height:1; }
.ficha-act b { display:block; font-size:16px; }
.ficha-act small { display:block; font-size:12.5px; color:#7b5a3a; margin-top:1px; }

/* Opciones de una sola respuesta */
.ops { display:grid; gap:10px; }
.op {
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--papel); border:2px solid var(--vp); border-radius:14px;
  padding:11px 14px; min-height:56px; font-size:16px; font-weight:600; line-height:1.25;
  box-shadow:4px 4px 0 var(--vp); transition:transform .1s, box-shadow .1s, background .15s, color .15s;
}
.op:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--vp); }
.op .e { font-size:24px; width:32px; text-align:center; flex-shrink:0; line-height:1; }
.op .tx { flex:1; }
.op .s { display:block; font-size:12.5px; font-weight:500; color:var(--gris); margin-top:2px; }
.op.si { background:var(--vp); color:var(--cr); box-shadow:4px 4px 0 var(--na); }
.op.si .s { color:var(--vc); }
.op:disabled { opacity:.35; cursor:default; }
/* Opciones de varias respuestas (lista con casilla) */
.op.multi { min-height:50px; padding:9px 12px; font-size:15px; box-shadow:3px 3px 0 var(--vp); }
.op.multi .e { font-size:20px; width:26px; }
.caja { width:22px; height:22px; border-radius:7px; border:2px solid var(--vp); flex-shrink:0; display:grid; place-items:center; background:var(--papel); }
.op.si .caja { background:var(--na); border-color:var(--na); }
.op.si .caja::after { content:''; width:6px; height:11px; border:solid var(--vp); border-width:0 3px 3px 0; transform:translateY(-1px) rotate(45deg); }

/* Fichitas para respuestas cortas */
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  display:inline-flex; align-items:center; gap:7px; background:var(--papel); border:2px solid var(--vp);
  border-radius:999px; padding:9px 14px; font-size:14.5px; font-weight:600; line-height:1.2; text-align:left;
  box-shadow:2px 2px 0 var(--vp);
}
.chip .e { font-size:18px; line-height:1; }
.chip.si { background:var(--vp); color:var(--cr); box-shadow:2px 2px 0 var(--na); }
.chip.si::after { content:'✓'; color:var(--oc); font-weight:800; }
.chip:disabled { opacity:.35; cursor:default; }

.nota-wrap { margin-top:14px; }
.campo, .nota {
  width:100%; border:2px solid var(--vp); border-radius:12px; background:var(--papel);
  padding:12px 14px; font-size:16px; outline:none;
}
.campo:focus, .nota:focus { box-shadow:0 0 0 3px rgba(238,125,29,.45); }
textarea.campo { min-height:130px; resize:vertical; line-height:1.45; }
.contador { text-align:right; font-size:12px; color:var(--gris); margin-top:4px; }
.palabra { font-family:'Fraunces', serif; font-weight:900; font-size:30px; text-align:center; padding:16px; }

/* ---------- PASAPORTE ---------- */
.pasaporte { display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; }
.pasaporte.ev { grid-template-columns:repeat(2, 1fr); }
@media (min-width:480px) { .pasaporte { grid-template-columns:repeat(4, 1fr); } .pasaporte.ev { grid-template-columns:repeat(3, 1fr); } }
.dia-tit { grid-column:1/-1; font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--vs); margin:6px 0 -2px; }
.sello-t {
  position:relative; overflow:hidden; background:var(--papel); border:2px solid var(--vp); border-radius:14px;
  padding:12px 6px 10px; min-height:98px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  text-align:center; box-shadow:3px 3px 0 var(--vp); transition:background .15s, border-color .15s;
}
.sello-t .e { font-size:30px; line-height:1; }
.sello-t .n { font-size:13.5px; font-weight:700; line-height:1.15; }
.sello-t .h { font-size:11px; color:var(--gris); line-height:1.2; }
.sello-t.si { background:var(--na-l); border-color:var(--na-t); }
.tinta {
  position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) rotate(-14deg);
  border:2.5px solid var(--rojo); color:var(--rojo); border-radius:6px; padding:2px 6px;
  font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
  background:rgba(255,253,247,.72); opacity:0; pointer-events:none;
}
.sello-t.si .tinta { opacity:.93; }
.sello-t.recien .tinta { animation:sellar .36s cubic-bezier(.3,1.5,.5,1); }
@keyframes sellar { 0% { opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(2.3); } 100% { opacity:.93; transform:translate(-50%,-50%) rotate(-14deg) scale(1); } }
.ninguno {
  margin-top:14px; width:100%; border:2px dashed var(--vs); background:transparent; border-radius:14px;
  padding:13px; font-weight:600; font-size:15px;
}
.ninguno.si { background:var(--vp); color:var(--cr); border-style:solid; }
.cuenta-sellos { text-align:center; font-size:13px; color:var(--gris); margin-top:10px; min-height:18px; }

/* ---------- TARJETA DE VEREDICTO ---------- */
.mazo { position:relative; margin:6px 6px 22px 0; }
.mazo.con-mas::before, .mazo.con-mas::after {
  content:''; position:absolute; inset:0; border:3px solid var(--vp); border-radius:22px; background:var(--papel);
}
.mazo.con-mas::before { transform:translate(9px, 9px) rotate(2.4deg); opacity:.55; }
.mazo.con-mas::after { transform:translate(4px, 4px) rotate(1deg); opacity:.85; }
.tarjeta {
  position:relative; z-index:1; background:var(--papel); border:3px solid var(--vp); border-radius:22px;
  padding:20px 16px 18px; text-align:center; box-shadow:5px 5px 0 var(--vp); overflow:hidden;
}
.t-cuenta { position:absolute; top:12px; right:14px; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--vs); text-transform:uppercase; }
.t-emoji { font-size:50px; width:86px; height:86px; border-radius:50%; background:var(--cr); display:grid; place-items:center; margin:0 auto 10px; border:2px dashed rgba(26,58,42,.3); line-height:1; }
.t-nombre { font-family:'Fraunces', serif; font-weight:900; font-size:25px; line-height:1.1; text-wrap:balance; }
.t-cuando { font-size:13.5px; color:var(--gris); margin-top:5px; }
.t-sello {
  position:absolute; top:46%; left:50%; transform:translate(-50%,-50%) rotate(-12deg) scale(2.2); opacity:0;
  font-family:'Fraunces', serif; font-weight:900; font-size:30px; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 14px; border:4px solid currentColor; border-radius:10px; background:rgba(255,253,247,.82); white-space:nowrap; pointer-events:none;
}
.tarjeta.sellada .t-sello { animation:selloGrande .38s cubic-bezier(.3,1.5,.5,1) forwards; }
@keyframes selloGrande { to { opacity:.95; transform:translate(-50%,-50%) rotate(-12deg) scale(1); } }
.tarjeta.v-igual .t-sello { color:var(--vv); }
.tarjeta.v-cambios .t-sello { color:var(--na-t); }
.tarjeta.v-no .t-sello { color:var(--rojo); }
.mazo.sale-igual .tarjeta { animation:saleArriba .5s .42s cubic-bezier(.5,0,.8,.4) forwards; }
.mazo.sale-cambios .tarjeta { animation:saleDer .5s .42s cubic-bezier(.5,0,.8,.4) forwards; }
.mazo.sale-no .tarjeta { animation:saleIzq .5s .42s cubic-bezier(.5,0,.8,.4) forwards; }
@keyframes saleArriba { to { transform:translate(30px,-140%) rotate(10deg); opacity:0; } }
@keyframes saleDer { to { transform:translate(130%, 10px) rotate(16deg); opacity:0; } }
@keyframes saleIzq { to { transform:translate(-130%, 30px) rotate(-16deg); opacity:0; } }
.veredictos .op { min-height:54px; }
.veredictos .v-igual { border-color:var(--vv); box-shadow:4px 4px 0 var(--vv); }
.veredictos .v-cambios { border-color:var(--na-t); box-shadow:4px 4px 0 var(--na-t); }
.veredictos .v-no { border-color:var(--rojo); box-shadow:4px 4px 0 var(--rojo); }
.veredictos .v-igual.si { background:var(--vv); color:#fff; }
.veredictos .v-cambios.si { background:var(--na-t); color:#fff; }
.veredictos .v-no.si { background:var(--rojo); color:#fff; }

/* ---------- MILPA DE LOS DIEZ MAÍCES ---------- */
.costal {
  display:flex; align-items:center; gap:12px; background:var(--papel); border:2px solid var(--vp); border-radius:14px;
  padding:10px 12px; margin-bottom:12px; box-shadow:3px 3px 0 var(--vp); position:sticky; top:84px; z-index:3;
}
.costal-n { font-family:'Fraunces', serif; font-weight:900; font-size:30px; line-height:1; color:var(--na-t); min-width:34px; text-align:center; }
.costal-t { font-size:12.5px; font-weight:600; color:var(--gris); line-height:1.25; }
.granos { display:flex; gap:2px; flex-wrap:wrap; margin-top:3px; }
.grano { width:13px; height:17px; display:block; transition:opacity .2s, transform .2s; }
.grano.usado { opacity:.16; transform:scale(.8); }
.macetas { display:grid; grid-template-columns:repeat(2, 1fr); gap:9px; }
.maceta { position:relative; background:var(--papel); border:2px solid var(--vp); border-radius:16px; box-shadow:3px 3px 0 var(--vp); transition:background .2s; }
.maceta.con { background:#F1F7EA; }
.sembrar { display:flex; align-items:flex-end; gap:6px; width:100%; background:none; border:0; padding:6px 8px 8px 4px; border-radius:14px; text-align:left; min-height:108px; }
.sembrar:disabled { cursor:default; }
.dib { width:58px; flex-shrink:0; }
.sembrar svg { width:58px; height:103px; display:block; }
.sembrar svg .crece { transform-origin:50px 80px; animation:crecer .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes crecer { from { transform:scale(.6, .4); } to { transform:none; } }
.m-t { flex:1; font-size:13px; font-weight:700; line-height:1.18; padding-bottom:4px; }
.m-t .e { display:block; font-size:20px; margin-bottom:3px; }
.m-n { display:block; font-family:'Fraunces', serif; font-weight:900; font-size:19px; color:var(--na-t); margin-top:3px; min-height:20px; }
.menos {
  position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%; border:2px solid var(--vp);
  background:var(--cs); font-weight:800; font-size:18px; line-height:1; display:grid; place-items:center;
}
.vuela { position:fixed; z-index:50; width:16px; height:21px; pointer-events:none; }

/* ---------- PIE CON EL BOTÓN ---------- */
.pie-accion {
  position:fixed; left:0; right:0; bottom:0; z-index:8; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(247,244,228,0), var(--cs) 30%);
}
.pie-in { max-width:528px; margin:0 auto; display:flex; gap:10px; align-items:center; }
.btn-sig, .btn-grande {
  flex:1; border:0; border-radius:999px; background:var(--vp); color:var(--cr); font-size:17px; font-weight:700;
  padding:15px 22px; box-shadow:4px 4px 0 var(--na); transition:transform .1s, box-shadow .1s, opacity .2s;
}
.btn-sig:active, .btn-grande:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--na); }
.btn-sig:disabled { opacity:.35; cursor:default; transform:none; }
.btn-sec {
  display:inline-flex; justify-content:center; align-items:center; gap:6px; border:2px solid var(--vp); border-radius:999px;
  background:var(--papel); padding:12px 20px; font-weight:700; font-size:15px; text-decoration:none; box-shadow:3px 3px 0 var(--vp);
}
.aviso {
  background:var(--rojo-l); border:2px solid var(--rojo); color:#6d2416; border-radius:12px; padding:10px 14px;
  font-size:14px; line-height:1.4; margin:12px 0;
}

/* ---------- PORTADA ---------- */
.tira { display:flex; justify-content:center; gap:6px; margin:0 -16px; padding:0 8px; position:relative; }
.tira::before { content:''; position:absolute; left:0; right:0; top:2px; height:2.5px; background:var(--vp); opacity:.6; }
.tira .bandera { flex:1; max-width:62px; height:42px; }
.tira .bandera:nth-child(odd) { animation:mecer 3.1s ease-in-out infinite; }
.tira .bandera:nth-child(even) { animation:mecer 2.7s ease-in-out infinite reverse; }
.portada { padding:18px 0 40px; }
.p-flag { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--vs); margin:14px 0 6px; }
.p-titulo {
  font-family:'Fraunces', serif; font-weight:900; font-size:clamp(58px, 18vw, 96px); line-height:.9; letter-spacing:-.02em;
  color:var(--vp); text-shadow:4px 4px 0 var(--na);
}
.p-titulo span { color:var(--na); text-shadow:4px 4px 0 var(--vp); }
.p-lead { font-size:16.5px; line-height:1.55; color:#34463b; margin:16px 0 14px; }
.p-pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.p-pills span { background:var(--vp); color:var(--cr); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; }
.p-conejo { display:flex; align-items:flex-end; gap:6px; margin:4px 0 18px; }
.p-conejo .cuerpo { width:122px; flex-shrink:0; }
.p-conejo .cuerpo svg { width:100%; height:auto; display:block; overflow:visible; }
.p-conejo .globo { margin-bottom:56px; font-size:14.5px; }
.p-acciones { display:grid; gap:12px; }
.p-acciones .btn-grande { width:100%; font-size:18px; padding:17px 22px; }
.p-link { display:block; text-align:center; font-weight:600; font-size:14.5px; color:var(--vs); margin-top:6px; }
.p-letra { font-size:12.5px; color:var(--gris); text-align:center; margin-top:18px; line-height:1.5; }
.ventana {
  background:var(--papel); border:2px solid var(--vp); border-radius:16px; padding:16px 18px; box-shadow:4px 4px 0 var(--vp);
  font-size:15px; line-height:1.5;
}
.ventana b { font-family:'Fraunces', serif; font-weight:900; font-size:21px; display:block; margin-bottom:4px; line-height:1.15; }
.cinta-prueba { background:var(--na); color:var(--vp); font-weight:700; font-size:12.5px; text-align:center; padding:6px 10px; border-radius:0 0 12px 12px; margin:0 auto; max-width:420px; }

/* ---------- FINAL ---------- */
.final { padding:26px 0 60px; text-align:center; }
.f-conejo { width:150px; margin:0 auto; }
.f-conejo svg { width:100%; height:auto; overflow:visible; }
.f-titulo { font-family:'Fraunces', serif; font-weight:900; font-size:64px; line-height:1; text-shadow:4px 4px 0 var(--na); margin-top:6px; }
.f-lead { font-size:17px; margin:10px 0 4px; font-weight:600; }
.f-tiempo { font-size:14.5px; color:var(--gris); }
.f-tarjeta { margin:22px auto 14px; max-width:330px; border:3px solid var(--vp); border-radius:18px; overflow:hidden; box-shadow:6px 6px 0 var(--vp); background:var(--papel); }
.f-tarjeta canvas { display:block; width:100%; height:auto; }
.f-botones { display:grid; gap:10px; max-width:360px; margin:0 auto; }

    '<rect x="25" y="76" width="50" height="9" rx="3" fill="#D9804C" stroke="#1A3A2A" stroke-width="3"/>';

}

/* ======================================================================
   LA RUTA: qué pantallas tocan según lo contestado
   ====================================================================== */
function clave(p) { return p.k + (p.id ? ':' + p.id : ''); }

function ruta() {
  var L = [], g = grupo();
  L.push({ k:'rol', sec:0 });
  L.push({ k:'martes', sec:0 });
  L.push({ k:'talleres', sec:1 });
  L.push({ k:'eventos', sec:1 });
  var sinTaller = S.talleres.length === 0;
  if (sinTaller && !esTallerista()) {
    L.push({ k:'frenos', sec:1 });
    if (S.frenos.indexOf('enterar') >= 0) L.push({ k:'canal', sec:1 });
    L.push({ k:'sumarme', sec:1 });
  }
  if (esTallerista()) { L.push({ k:'talOtra', sec:1 }); L.push({ k:'talFalto', sec:1 }); }
  var tarjetas = [];
  S.talleres.forEach(function (id) {
    L.push({ k:'asist', id:id, sec:2 });
    var a = act(id);
    if (a.asist === 'deje' || a.asist === 'nunca') L.push({ k:'motivo', id:id, sec:2 });
    if (a.asist && a.asist !== 'nunca') {
      var v = { k:'ver', id:id, tipo:'taller', sec:2 }; L.push(v); tarjetas.push(v);
      if (a.ver === 'cambios') L.push({ k:'cambios', id:id, tipo:'taller', sec:2 });
      if (a.ver === 'no') L.push({ k:'porqueNo', id:id, tipo:'taller', sec:2 });
    }
  });
  S.eventos.forEach(function (id) {
    var a = act(id);
    var v = { k:'ver', id:id, tipo:'evento', sec:2 }; L.push(v); tarjetas.push(v);
    if (a.ver === 'cambios') L.push({ k:'cambios', id:id, tipo:'evento', sec:2 });
    if (a.ver === 'no') L.push({ k:'porqueNo', id:id, tipo:'evento', sec:2 });
  });
  // Total esperado: un taller sin contestar todavía cuenta, uno al que nunca fue no.
  var esperadas = S.eventos.length + S.talleres.filter(function (id) { return act(id).asist !== 'nunca'; }).length;
  tarjetas.forEach(function (t, i) { t.n = i + 1; t.total = Math.max(esperadas, tarjetas.length); });
  L.push({ k:'palabra', sec:3 });
  if (participo()) { L.push({ k:'dejo', sec:3 }); L.push({ k:'gente', sec:3 }); }
  L.push({ k:'sin', sec:3 });
  L.push({ k:'balance', sec:3 });
  L.push({ k:'maiz', sec:4 });
  if (!S.maizSaltado && S.maiz.deporte > 0) L.push({ k:'torneo', sec:4 });
  if (g === 'estudiante') { if (participo()) L.push({ k:'porque', sec:4 }); L.push({ k:'choque', sec:4 }); }
  if (g === 'docente') L.push({ k:'suspension', sec:4 });
  if (g === 'docente' || g === 'admin') {
    L.push({ k:'carga', sec:4 });
    if (S.carga === 'bastante' || S.carga === 'demasiado') L.push({ k:'cargaTipo', sec:4 });
  }
  if (g === 'admin') L.push({ k:'salir', sec:4 });
  L.push({ k:'deseo', sec:4 });
  L.push({ k:'coordinara', sec:4 });
  L.push({ k:'voluntario', sec:4 });
  return L;
}
function buscaEnRuta(k) {
  var L = ruta();
  for (var i = 0; i < L.length; i++) if (clave(L[i]) === k) return L[i];
  return null;
}
function desdeClave(k) {
  var p = buscaEnRuta(k);
  if (p) return p;
  var partes = k.split(':');
  return { k:partes[0], id:partes[1], sec:0 };
}

/* ======================================================================
   DIBUJAR UNA PANTALLA
   ====================================================================== */
function guiaHTML(c) {
  return '<div class="guia"><div class="guia-cara">' + conejo({ expr:c.cara, disfraz:c.disfraz }) + '</div>' +
    '<div class="globo" aria-live="polite">' + esc(c.b || '') + '</div></div>';
}
function fichaHTML(f) {
  if (!f) return '';
  return '<div class="ficha-act"><span class="e" aria-hidden="true">' + f.e + '</span><span><b>' + esc(f.n) + '</b><small>' + esc(f.h) + '</small></span></div>';
}

function mostrar(k, dir) {
  var p = desdeClave(k);
  var c = definir(p);
  actual = k;
  bloqueado = false;
  document.body.classList.add('en-curso');
  $('#barra').hidden = false;
  var el = $('#pantalla');
  el.className = 'pantalla';
  el.innerHTML = guiaHTML(c) + fichaHTML(c.ficha) + '<h1 class="preg">' + esc(c.t) + '</h1>' +
    (c.s ? '<p class="sub">' + esc(c.s) + '</p>' : '') + '<div class="cuerpo"></div>';
  var cuerpo = $('.cuerpo', el);
  var pie = configurarPie(c);
  ({ uno:cuerpoUno, numeros:cuerpoUno, varios:cuerpoVarios, pasaporte:cuerpoPasaporte, veredicto:cuerpoVeredicto,
     palabra:cuerpoPalabra, abierta:cuerpoAbierta, maiz:cuerpoMaiz, voluntario:cuerpoVoluntario })[c.tipo](c, cuerpo, pie);
  dibujarBarra(p);
  void el.offsetWidth;
  el.classList.add('entra');
  if (dir < 0) el.classList.add('izq');
  window.scrollTo(0, 0);
  try { el.focus({ preventScroll:true }); } catch (e) { el.focus(); }
  guardarBorrador();
}

function configurarPie(c) {
  var pie = $('#pie'), btn = $('#btn-sig');
  var auto = c.tipo === 'uno' || c.tipo === 'numeros' || c.tipo === 'veredicto';
  pie.hidden = auto;
  btn.disabled = false;
  btn.textContent = 'Siguiente →';
  btn.onclick = function () { if (!btn.disabled) siguiente(); };
  return {
    btn:btn,
    listo:function (ok, etiqueta) { btn.disabled = !ok; if (etiqueta) btn.textContent = etiqueta; }
  };
}

function dibujarBarra(p) {
  var L = ruta(), sec = p.sec;
  var enSec = L.filter(function (x) { return x.sec === sec; });
  var j = Math.max(0, enSec.map(clave).indexOf(clave(p)));
  var i = Math.max(0, L.map(clave).indexOf(clave(p)));
  var avance = (sec + j / Math.max(1, enSec.length)) / SECCIONES.length;
  var html = '<div class="hilo"><i style="width:' + Math.round(avance * 100) + '%"></i></div>';
  SECCIONES.forEach(function (n, s) {
    var color = s < sec ? COLORES[s] : (s === sec ? COLORES[s] : '#E3DBBD');
    html += '<div class="bandera' + (s === sec ? ' actual' : '') + '" style="opacity:' + (s === sec ? 1 : (s < sec ? 1 : .9)) + '">' + bandera(color) + '</div>';
  });
  $('#picado').innerHTML = html;
  var quedan = Math.max(0, L.length - i - 1);
  var min = Math.ceil(quedan * MIN_SEG / 60);
  $('#seccion').innerHTML = '<span>' + (sec + 1) + ' de 5 · ' + SECCIONES[sec] + '</span><span>' +
    (quedan <= 2 ? 'Ya casi' : 'te falta' + (min > 1 ? 'n' : '') + ' ~' + min + ' min') + '</span>';
  $('#btn-atras').onclick = atras;
}

/* ---------- una sola respuesta ---------- */
function cuerpoUno(c, cuerpo) {
  var v = c.val();
  var numeros = c.tipo === 'numeros';
  cuerpo.innerHTML = '<div class="ops">' + c.ops.map(function (o) {
    var izq = numeros ? '<span class="e" style="font-family:Fraunces,serif;font-weight:900;font-size:22px;width:46px">' + esc(o.n) + '</span>'
                      : (o.e ? '<span class="e" aria-hidden="true">' + o.e + '</span>' : '');
    return '<button type="button" class="op' + (v === o.id ? ' si' : '') + '" data-id="' + o.id + '">' + izq +
      '<span class="tx">' + esc(txt(o.t)) + (o.s ? '<span class="s">' + esc(o.s) + '</span>' : '') + '</span></button>';
  }).join('') + '</div>';
  $$('.op', cuerpo).forEach(function (b) {
    b.addEventListener('click', function () {
      if (bloqueado) return;
      bloqueado = true;
      $$('.op', cuerpo).forEach(function (x) { x.classList.toggle('si', x === b); });
      c.set(b.dataset.id);
      guardarBorrador();
      setTimeout(siguiente, REDUCIR ? 120 : 330);
    });
  });
}

/* ---------- varias respuestas ---------- */
function cuerpoVarios(c, cuerpo, pie) {
  var sel = c.val();
  var chips = !!c.chips;
  var conTexto = c.ops.some(function (o) { return o.texto; }) || c.otro;
  var html = '<div class="' + (chips ? 'chips' : 'ops') + '">' + c.ops.map(function (o) {
    var on = sel.indexOf(o.id) >= 0;
    return '<button type="button" class="' + (chips ? 'chip' : 'op multi') + (on ? ' si' : '') + '" data-id="' + o.id + '" aria-pressed="' + on + '">' +
      (o.e ? '<span class="e" aria-hidden="true">' + o.e + '</span>' : '') + '<span class="tx">' + esc(txt(o.t)) + '</span>' +
      (chips ? '' : '<span class="caja" aria-hidden="true"></span>') + '</button>';
  }).join('') + '</div>';
  if (conTexto) {
    var ph = c.otro ? 'Otro taller: escríbelo aquí' : 'Escríbelo aquí (opcional)';
    html += '<div class="nota-wrap"' + (c.otro ? '' : ' hidden') + '><label class="sr" for="nota">' + ph + '</label>' +
      '<input id="nota" class="nota" type="text" maxlength="' + (c.otro ? 60 : 160) + '" placeholder="' + ph + '" autocomplete="off"></div>';
  }
  cuerpo.innerHTML = html;
  var nota = $('.nota', cuerpo);
  if (nota) {
    nota.value = c.otro ? S.deseoOtro : (S.notas[actual] || '');
    nota.addEventListener('input', function () {

function cuerpoMaiz(c, cuerpo, pie) {
  var TOTAL = 10;
  function usados() { return D.maiz.reduce(function (s, m) { return s + (S.maiz[m.id] || 0); }, 0); }
  var html = '<div class="costal"><div class="costal-n" id="quedan"></div><div><div class="costal-t" id="costal-t"></div><div class="granos" id="granos"></div></div></div><div class="macetas">';
  D.maiz.forEach(function (m) {
    html += '<div class="maceta" data-id="' + m.id + '">' +
      '<button type="button" class="sembrar" aria-label="Sembrar un maíz en ' + esc(m.t) + '"><span class="dib"></span>' +
      '<span class="m-t"><span class="e" aria-hidden="true">' + m.e + '</span>' + esc(m.t) + '<span class="m-n" aria-hidden="true"></span></span></button>' +
      '<button type="button" class="menos" aria-label="Quitar un maíz de ' + esc(m.t) + '" hidden>−</button></div>';
  });
  html += '</div>';
  cuerpo.innerHTML = html;
  function pintar(idNuevo) {
    var u = usados(), q = TOTAL - u;
    $('#quedan').textContent = q;
    $('#costal-t').textContent = q === 0 ? '¡Listo! Sembraste los diez.' : (q === 1 ? 'Te queda un maíz.' : 'Te quedan ' + q + ' maíces.');
    $('#granos').innerHTML = Array.apply(null, Array(TOTAL)).map(function (_, i) { return grano(); }).join('');
    $$('#granos .grano').forEach(function (g, i) { g.classList.toggle('usado', i >= q); });
    $$('.maceta', cuerpo).forEach(function (mc) {
      var id = mc.dataset.id, k = S.maiz[id] || 0;
      $('.dib', mc).innerHTML = planta(k, id === idNuevo);
      $('.m-n', mc).textContent = k ? k + (k === 1 ? ' maíz' : ' maíces') : '';
      $('.menos', mc).hidden = k === 0;
      $('.sembrar', mc).disabled = q === 0;
      mc.classList.toggle('con', k > 0);
    });
    pie.listo(q === 0, q === 0 ? 'Siguiente →' : 'Siembra los diez');
  }
  function vuelo(destino) {
    if (REDUCIR) return;
    var origen = $('#granos .grano:not(.usado):last-of-type') || $('#granos');
    var a = origen.getBoundingClientRect(), b = destino.getBoundingClientRect();
    var g = document.createElement('div');
    g.className = 'vuela'; g.innerHTML = grano();
    g.style.left = a.left + 'px'; g.style.top = a.top + 'px';
    document.body.appendChild(g);
    var dx = b.left + b.width / 2 - a.left - 8, dy = b.top + b.height * 0.42 - a.top;
    if (g.animate) {
      g.animate([
        { transform:'translate(0,0) rotate(0) scale(1)' },
        { transform:'translate(' + dx * 0.5 + 'px,' + (dy * 0.5 - 60) + 'px) rotate(200deg) scale(1.3)', offset:.5 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) rotate(400deg) scale(.7)' }
      ], { duration:520, easing:'cubic-bezier(.4,0,.6,1)' }).onfinish = function () { g.remove(); };
    } else setTimeout(function () { g.remove(); }, 10);
  }
  $$('.maceta', cuerpo).forEach(function (mc) {
    var id = mc.dataset.id;
    $('.sembrar', mc).addEventListener('click', function () {
      if (usados() >= TOTAL) return;
      vuelo(mc);
      S.maiz[id] = (S.maiz[id] || 0) + 1; S.maizSaltado = false;
      setTimeout(function () { pintar(id); }, REDUCIR ? 0 : 380);
      guardarBorrador();
    });
    $('.menos', mc).addEventListener('click', function () {
      if (!S.maiz[id]) return;
      S.maiz[id]--; pintar(); guardarBorrador();
    });
  });
  pie.btn.onclick = function () { if (usados() === TOTAL) siguiente(); };
  // Saltar: un enlace discreto bajo las macetas
  var saltar = document.createElement('button');
  saltar.type = 'button'; saltar.className = 'p-link'; saltar.style.cssText = 'background:none;border:0;margin:16px auto 0;text-decoration:underline';
  saltar.textContent = 'Prefiero no sembrar';
  saltar.addEventListener('click', function () {
    D.maiz.forEach(function (m) { S.maiz[m.id] = 0; });
    S.maizSaltado = true; S.torneo = null; siguiente();
  });
  cuerpo.appendChild(saltar);
  pintar();
}

/* ======================================================================
   NAVEGACIÓN
   ====================================================================== */
function siguiente() {
  var L = ruta(), ks = L.map(clave), i = ks.indexOf(actual);
  // Si la pantalla en turno ya no está en la ruta (cambió una respuesta anterior), sigue desde la última visitada que sí esté.
  for (var hh = historial.length - 1; i < 0 && hh >= 0; hh--) i = ks.indexOf(historial[hh]);
  if (i < 0) i = 0;
  var sig = L[i + 1];
  if (!sig) return enviar();
  historial.push(actual);
  mostrar(clave(sig), 1);
}
function atras() {
  var ant = historial.pop();
  if (ant) mostrar(ant, -1); else portada();
}

function guardarBorrador() {
  if (!actual) return;
  almacen.poner(K.borrador, { S:S, actual:actual, historial:historial, guardado:Date.now() });
}

function mandar(paquete) {
  if (!API) return Promise.resolve({ ok:false, sinUrl:true });
  return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(paquete) })
    .then(function (r) { return r.json(); })
    .then(function (d) { return d && d.ok ? d : { ok:false, error:(d && d.error) || 'respuesta' }; })
    .catch(function () { return { ok:false, error:'red' }; });
}

var enviando = false;
function enviar() {
  if (enviando) return;
  enviando = true;
  var btn = $('#btn-sig');
  btn.disabled = true; btn.textContent = 'Enviando…';
  var paquete = armarPaquete();
  mandar(paquete).then(function (res) {
    enviando = false;
    if (res.ok) {
      almacen.poner(K.enviada, { fecha:paquete.enviada, numero:res.numero || null, prueba:PREVIEW });
      almacen.quitar(K.borrador); almacen.quitar(K.pendiente);
      final(paquete, res);
    } else if (res.sinUrl) {
      almacen.quitar(K.borrador);
      final(paquete, res);
    } else {
      almacen.poner(K.pendiente, paquete);
      btn.disabled = false; btn.textContent = 'Reintentar el envío';
      var av = $('#aviso-envio');
      if (av) av.innerHTML = '<p class="aviso">No se pudo enviar. Revisa la señal y vuelve a tocar el botón: tus respuestas siguen guardadas en este teléfono.</p>';
    }
  });
}

function reintentarPendiente() {
  var pend = almacen.leer(K.pendiente);
  if (!pend || !API) return;
  mandar(pend).then(function (res) {
    if (res.ok) {
      almacen.quitar(K.pendiente);
      almacen.poner(K.enviada, { fecha:pend.enviada, numero:res.numero || null, prueba:!!pend.prueba });
      if (!actual) portada();
    }
  });
}

/* ======================================================================
   PORTADA
   ====================================================================== */
function ventana() {
  var ahora = Date.now();
  if (PREVIEW || (LOCAL && P.has('abierta'))) return 'abierta';
  if (!API) return 'pronto';
  if (ahora < Date.parse(D.abre)) return 'pronto';
  if (ahora > Date.parse(D.cierra)) return 'cerrada';
  return 'abierta';
}

  } else if (enviada && !(enviada.prueba && !PREVIEW)) {

    tira + '<section class="portada">' +

    '<h1 class="p-titulo">¿Qué se <span>queda?</span></h1>' +

    '<p class="p-letra">Para estudiantes de los tres programas, docentes y administrativos del Campus Concá.<br>No pedimos tu nombre. Este teléfono guarda un número al azar para no contar dos veces la misma respuesta.</p>' +

/* ======================================================================
   FINAL: gracias, tarjeta para compartir y cómo va el campus
   ====================================================================== */
function final(paquete, res) {
  actual = null;
  document.body.classList.remove('en-curso');
  $('#barra').hidden = true; $('#pie').hidden = true;
  var seg = paquete.segundos, min = Math.floor(seg / 60), s = seg % 60;
  var resultados = 'evaluacion-resultados.html' + PASE;
  var wa = 'https://wa.me/?text=' + encodeURIComponent('¿Qué se queda en la Franja Libre? Cinco minutos y es anónimo: ' + D.url);
  var puedeCompartir = !!(navigator.canShare && window.File);
  $('#pantalla').className = 'pantalla entra';
  $('#pantalla').innerHTML = '<section class="final">' +
    '<div class="f-conejo">' + conejo({ expr:'feliz', cuerpo:true }) + '</div>' +
    '<h1 class="f-titulo">¡Listo!</h1>' +
    '<p class="f-lead">Tu voz ya cuenta para la Franja de ' + esc(D.proximo) + '.</p>' +
    '<p class="f-tiempo">Lo hiciste en ' + (min ? min + ' min ' : '') + s + ' s' + (seg <= 300 ? ', dentro de los cinco minutos prometidos.' : '.') + '</p>' +
    (res.sinUrl ? '<p class="aviso">Vista previa: la hoja de cálculo todavía no está conectada, así que esto no se envió.</p>' : '') +
    (paquete.prueba && !res.sinUrl ? '<p class="aviso" style="background:var(--na-l);border-color:var(--na-t);color:#6b3a0e">Respuesta de prueba: llegó a la hoja, pero no cuenta en los resultados.</p>' : '') +
    '<div class="f-tarjeta"><canvas id="tarjeta" width="1080" height="1350" aria-label="Tu tarjeta de la Franja"></canvas></div>' +
    '<div class="f-botones"><button type="button" class="btn-grande" id="b-tarjeta">' + (puedeCompartir ? 'Compartir mi tarjeta' : 'Guardar mi tarjeta') + '</button>' +
    '<a class="btn-sec" href="' + wa + '" target="_blank" rel="noopener">💬 Pasar el enlace por WhatsApp</a></div>' +
    '<div class="f-campus" id="f-campus"></div>' +
    '<a class="btn-sec" href="' + resultados + '">📊 Ver todos los resultados →</a>' +
    '</section>';
  window.scrollTo(0, 0);
  confeti();
  dibujarTarjeta(paquete).then(function () {
    $('#b-tarjeta').onclick = function () { compartirTarjeta(); };
  });

}

function compartirTarjeta() {
  var cv = $('#tarjeta');
  cv.toBlob(function (blob) {
    if (!blob) return;
    var nombre = 'mi-franja-' + D.semestre + '.png';
    var archivo = null;
    try { archivo = new File([blob], nombre, { type:'image/png' }); } catch (e) {}
    if (archivo && navigator.canShare && navigator.canShare({ files:[archivo] })) {
      navigator.share({ files:[archivo], text:'Yo ya dije qué se queda en la Franja Libre. ¿Y tú? ' + D.url })
        .catch(function (e) { if (e && e.name !== 'AbortError') descargar(blob, nombre); });
    } else descargar(blob, nombre);
  }, 'image/png');
}
function descargar(blob, nombre) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function dibujarTarjeta(paq) {
  var cv = $('#tarjeta'), x = cv.getContext('2d');
  var r = paq.r;
  var fuentes = document.fonts && document.fonts.load ? Promise.all([
    document.fonts.load('900 120px Fraunces'), document.fonts.load('italic 400 40px Fraunces'),
    document.fonts.load('700 40px "Instrument Sans"'), document.fonts.load('600 40px "Instrument Sans"')
  ]).catch(function () {}) : Promise.resolve();
  var img = new Image();
  var cargaImg = new Promise(function (ok) {
    img.onload = ok; img.onerror = ok;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(conejo({ expr:'feliz', cuerpo:true }));
  });
  return Promise.all([fuentes, cargaImg]).then(function () {
    x.fillStyle = '#F7F4E4'; x.fillRect(0, 0, 1080, 1350);
    // semitono
    for (var i = 0; i < 36; i++) for (var j = 0; j < 26; j++) {
      var dd = Math.hypot(i, j * 1.25); if (dd > 24) continue;
      x.fillStyle = 'rgba(238,125,29,' + (0.42 * (1 - dd / 24)).toFixed(3) + ')';
      x.beginPath(); x.arc(1080 - i * 20, 150 + j * 20, 3.4, 0, 7); x.fill();
    }
    // papel picado
    x.strokeStyle = '#1A3A2A'; x.lineWidth = 5; x.beginPath(); x.moveTo(0, 30); x.lineTo(1080, 30); x.stroke();
    var cols = ['#D23C6E', '#E8A85A', '#2D7A4F', '#EE7D1D', '#1A6B5A', '#D23C6E', '#E8A85A'];
    cols.forEach(function (c, k) { banderaCanvas(x, 24 + k * 150, 30, 134, 100, c); });
    // encabezado
    x.textBaseline = 'alphabetic';
    x.fillStyle = '#2D5A3D'; x.font = '700 30px "Instrument Sans", sans-serif';
    espaciado(x, 'CAMPUS CONCÁ · UAQ · FRANJA LIBRE', 80, 228, 5);
    x.font = '900 170px Fraunces, serif';
    x.fillStyle = '#EE7D1D'; x.fillText('Mi Franja', 88, 398);
    x.fillStyle = '#1A3A2A'; x.fillText('Mi Franja', 80, 390);
    x.font = '900 104px Fraunces, serif'; x.fillStyle = '#4A8C5C'; x.fillText(D.semestre, 84, 500);
    // lo vivido
    var nt = r.talleres.filter(function (t) { return t.asist && t.asist !== 'nunca'; }).length, ne = r.eventos.length;
    var y = 610;
    x.fillStyle = '#1A3A2A';
    if (r.martes === 'dando') {
      x.font = '700 46px "Instrument Sans", sans-serif'; x.fillText('Di un taller', 84, y); y += 60;
      if (nt || ne) { x.font = '600 38px "Instrument Sans", sans-serif'; x.fillText('y estuve en ' + cuenta(nt, 'taller', 'talleres') + ' y ' + cuenta(ne, 'evento', 'eventos'), 84, y); y += 56; }
    } else if (nt || ne) {
      x.font = '600 36px "Instrument Sans", sans-serif'; x.fillStyle = '#5E6D63'; x.fillText('Estuve en', 84, y); y += 70;
      x.fillStyle = '#1A3A2A'; x.font = '900 76px Fraunces, serif';
      x.fillText(cuenta(nt, 'taller', 'talleres'), 84, y); y += 84;
      x.fillText(cuenta(ne, 'evento', 'eventos'), 84, y); y += 40;
    } else {
      x.font = '700 44px "Instrument Sans", sans-serif';
      x.fillText('No me sumé a nada…', 84, y); y += 58;
      x.font = '600 38px "Instrument Sans", sans-serif'; x.fillStyle = '#5E6D63'; x.fillText('y dije por qué.', 84, y); y += 40;
    }
    // palabra
    if (r.palabra) {
      y += 60;
      x.fillStyle = '#5E6D63'; x.font = '600 34px "Instrument Sans", sans-serif'; x.fillText('Mi palabra:', 84, y); y += 74;
      x.fillStyle = '#A9500F'; x.font = 'italic 400 72px Fraunces, serif';
      x.fillText('«' + r.palabra + '»', 80, y, 600);
    }
    // conejo
    x.drawImage(img, 640, 560, 380, 538);
    // lo sembrado
    if (r.maiz) {
      var top = D.maiz.map(function (m) { return { m:m, n:r.maiz[m.id] || 0 }; }).filter(function (o) { return o.n > 0; })
        .sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
      if (top.length) {
        var y2 = 1058;
        x.fillStyle = '#5E6D63'; x.font = '600 34px "Instrument Sans", sans-serif'; x.fillText('Para enero sembré:', 84, y2);
        x.font = '700 40px "Instrument Sans", sans-serif'; x.fillStyle = '#1A3A2A';
        var xx = 84;
        top.forEach(function (o) {
          var tx = o.m.e + ' ' + o.n + '  ';
          x.fillText(tx, xx, y2 + 60); xx += x.measureText(tx).width + 18;
        });
      }
    }
    // pie
    redondo(x, 60, 1168, 960, 136, 40, '#1A3A2A');
    x.fillStyle = '#F5EED8'; x.font = '700 40px "Instrument Sans", sans-serif';
    x.fillText('Yo ya dije qué se queda. ¿Y tú?', 104, 1228);
    x.fillStyle = '#E8A85A'; x.font = '600 28px "Instrument Sans", sans-serif';
    x.fillText(D.url.replace(/^https?:\/\//, ''), 104, 1274);
  });
}
function cuenta(n, uno, varios) { return (n === 0 ? 'cero' : n) + ' ' + (n === 1 ? uno : varios); }
function espaciado(x, t, px, py, sp) {
  if ('letterSpacing' in x) { x.letterSpacing = sp + 'px'; x.fillText(t, px, py); x.letterSpacing = '0px'; return; }
  for (var i = 0; i < t.length; i++) { x.fillText(t[i], px, py); px += x.measureText(t[i]).width + sp; }
}
function redondo(x, px, py, w, h, rr, color) {
  x.fillStyle = color; x.beginPath();
  x.moveTo(px + rr, py); x.arcTo(px + w, py, px + w, py + h, rr); x.arcTo(px + w, py + h, px, py + h, rr);
  x.arcTo(px, py + h, px, py, rr); x.arcTo(px, py, px + w, py, rr); x.closePath(); x.fill();
}
function banderaCanvas(x, px, py, w, h, color) {
  x.save(); x.translate(px, py);
  var dient = 10, paso = w / dient, alto = h * 0.84;
  x.fillStyle = color; x.beginPath(); x.moveTo(0, 0); x.lineTo(w, 0); x.lineTo(w, alto);
  for (var i = dient; i > 0; i--) { x.lineTo(i * paso - paso / 2, h); x.lineTo((i - 1) * paso, alto); }
  x.closePath(); x.fill();
  x.fillStyle = '#F7F4E4';
  var cx = w / 2, cy = h * 0.4;
  [[0, 0, 9], [0, -16, 4.5], [0, 16, 4.5], [-16, 0, 4.5], [16, 0, 4.5]].forEach(function (c) { x.beginPath(); x.arc(cx + c[0], cy + c[1], c[2], 0, 7); x.fill(); });
  [[w * 0.17, h * 0.22], [w * 0.83, h * 0.22], [w * 0.17, h * 0.6], [w * 0.83, h * 0.6]].forEach(function (c) {
    x.beginPath(); x.moveTo(c[0], c[1] - 7); x.lineTo(c[0] + 6, c[1]); x.lineTo(c[0], c[1] + 7); x.lineTo(c[0] - 6, c[1]); x.closePath(); x.fill();
  });
  x.restore();
}

function cargarCampus(res) {
  var caja = $('#f-campus');
  if (!caja || !API) return;
  fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'accion=resultados')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var t = d && d.seg && d.seg.todos;
      var html = '<h2>Así va el campus</h2>';
      if (res.numero) html += '<div class="dato"><span class="n">#' + res.numero + '</span><span>Eres la respuesta número ' + res.numero + '.</span></div>';
      if (!t || t.oculto || !t.n) {
        html += '<div class="dato"><span class="n">🌱</span><span>Los resultados se muestran cuando haya al menos ' + D.minimoGrupo + ' respuestas. Vas entre las primeras.</span></div>';
        caja.innerHTML = html; return;
      }
      var mucho = t.sin && t.sin.mucho ? Math.round(100 * t.sin.mucho / t.n) : 0;
      html += '<div class="dato"><span class="n">' + mucho + '%</span><span>la extrañaría mucho si en enero ya no hubiera Franja.</span></div>';
      if (t.maiz && t.maiz.total) {
        var mx = D.maiz.slice().sort(function (a, b) { return (t.maiz.suma[b.id] || 0) - (t.maiz.suma[a.id] || 0); })[0];
        html += '<div class="dato"><span class="n">' + mx.e + '</span><span>Lo más sembrado para enero hasta ahora: <b>' + esc(mx.t) + '</b>.</span></div>';
      }
      var pedido = tallerMasPedido(t);
      if (pedido) html += '<div class="dato"><span class="n">🙋</span><span>El taller nuevo más pedido: <b>' + esc(pedido) + '</b>.</span></div>';
      caja.innerHTML = html;
    })
    .catch(function () {});
}

function normal(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zñ0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
/* Junta las fichitas elegidas con lo escrito a mano que coincide con alguna */
function tallerMasPedido(t) {
  var cuenta = {};
  D.op.deseo.forEach(function (o) { cuenta[o.t] = (t.deseo && t.deseo[o.id]) || 0; });
  (t.deseosEscritos || []).forEach(function (w) {
    var igual = D.op.deseo.filter(function (o) { return normal(o.t) === normal(w.t); })[0];
    var k = igual ? igual.t : w.t.charAt(0).toUpperCase() + w.t.slice(1);
    cuenta[k] = (cuenta[k] || 0) + w.n;
  });
  var mejor = Object.keys(cuenta).sort(function (a, b) { return cuenta[b] - cuenta[a]; })[0];
  return mejor && cuenta[mejor] > 0 ? mejor : '';
}

function confeti() {
  if (REDUCIR) return;
  var cv = $('#confeti'), x = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  var W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.display = 'block';
  var cols = ['#D23C6E', '#E8A85A', '#2D7A4F', '#EE7D1D', '#1A6B5A', '#F2C14E'];
  var ps = [];
  for (var i = 0; i < 110; i++) ps.push({
    x:Math.random() * W, y:-Math.random() * H * 0.7 - 20 * dpr, w:(10 + Math.random() * 12) * dpr, h:(14 + Math.random() * 12) * dpr,
    c:cols[Math.floor(Math.random() * cols.length)], vy:(2.2 + Math.random() * 3) * dpr, vx:(Math.random() - 0.5) * 1.6 * dpr,
    r:Math.random() * 6, vr:(Math.random() - 0.5) * 0.14, f:Math.random() * 6
  });
  var t0 = performance.now();
  function cuadro(t) {
    x.clearRect(0, 0, W, H);
    ps.forEach(function (p) {
      p.y += p.vy; p.x += p.vx + Math.sin(t / 420 + p.f) * 0.9 * dpr; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, Math.cos(t / 260 + p.f));
      x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.fillStyle = 'rgba(247,244,228,.92)'; x.beginPath(); x.arc(0, 0, p.w * 0.17, 0, 7); x.fill();
      x.restore();
    });
    if (t - t0 < 4300) requestAnimationFrame(cuadro);
    else { x.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(cuadro);
}

/* ======================================================================
   ARRANQUE
   ====================================================================== */
portada();
reintentarPendiente();
if (LOCAL) window.__fl = { conejo:conejo, planta:planta, estado:function () { return S; }, paquete:armarPaquete, ruta:ruta };
})();
